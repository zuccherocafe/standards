schema_version = "1.3"
artifacts = ["/var/tmp/findings.jsonl", "/var/tmp/agent-identity.txt"]

[task]
name = "standards/review-design-read-area-files"
description = "Review the change that makes design-read check a living area file; it accepts header fields beyond the three and None found. beside a table without rows."
authors = []
keywords = ["rust", "review"]

[metadata]
source_repository = "https://github.com/zuccherocafe/standards"
# The change is the reviewed commit; its description adds the brief's format sentences to the commit's own
# message, since its review had the brief. The review found both defects, and the landed aed783af fixed them.
# The image's first commit holds the change's base tools/, built from this public base; its second holds the
# change, environment/change.patch, with environment/message.txt as its description.
source_base = "3ddf4c52ef5079f3f4f977b1e3c62721dccc8b1f"
base_tree = "d7894a156aac68398b275356f915e76a9d17353b"
change_tree = "ed04a85ebe1dca9d962bdc558391794193c7c2f1"
change_revision = "f0196c60e7e55262fbf223d3f785eb2d23c34935"
fix_revision = "aed783affc2b7b47019e9f63733bcf84dab27d38"
# The image's second commit, the change the agent reviews.
starting_commit = "61d93eaa9f9c228356522b0456923e9f8f5c18c4"

[environment]
# The model provider only, from start to teardown, so no phase that follows the agent's run, such as collecting its
# findings, reopens the network. The image holds Node and pi, so the agent's setup needs no network.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
storage_mb = 10240

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

# The agent's findings, copied in its own container before it stops, are all the verifier receives; a review that
# wrote none leaves nothing to copy.
[[verifier.collect]]
command = "[ ! -f /app/findings.jsonl ] || cp /app/findings.jsonl /var/tmp/findings.jsonl"
timeout_sec = 120.0

# What the agent ran on: the Node, npm and pi the image holds, and pi's installed tree.
[[verifier.collect]]
command = '{ echo "node $(node --version 2>&1)"; echo "npm $(npm --version 2>&1)"; echo "pi $(pi --version 2>&1)"; sha256sum /opt/pi/package-lock.json; (cd /opt/pi && npm ls --all --json 2>&1); } > /var/tmp/agent-identity.txt'
timeout_sec = 120.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
storage_mb = 10240

schema_version = "1.3"
artifacts = ["/var/tmp/model.patch", "/var/tmp/agent-identity.txt"]

[task]
name = "standards/dandegate-host-programs"
description = "dandegate gives every step the host programs dandegate.toml names, after the revision shell's own tools."
authors = []
keywords = ["rust", "feature"]

[metadata]
source_repository = "https://github.com/zuccherocafe/standards"
# The starting tree is the base revision's tools/.
source_base = "dd3c3d67e5aa0db8a2400d35d33e9ce36ddc72b2"
source_tree = "17ee11d0868d3cfe8c94ae3626383057e64eeb67"
# The landed change that solution/solution.patch holds, production and its own tests.
solution_revision = "8871aa33f10a60ec4efb62452d1b3bab1153457d"
# The commit the image makes of the starting tree; the agent's change is the difference from it.
starting_commit = "18d70921d673e24424c2f820f0f0e6ddf75e7a3e"

[environment]
# The model provider only, from start to teardown, so no phase that follows the agent's run, such as collecting its
# change, reopens the network. The image holds Node and pi, so the agent's setup needs no network.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
storage_mb = 10240

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

# The agent's change, captured in its own container before it stops, is all the verifier receives.
[[verifier.collect]]
command = "cd /app && git add -A && git diff --cached --binary 18d70921d673e24424c2f820f0f0e6ddf75e7a3e > /var/tmp/model.patch"
timeout_sec = 120.0

# What the agent ran on: the Node, npm and pi the image holds, and pi's installed tree.
[[verifier.collect]]
command = '{ echo "node $(node --version 2>&1)"; echo "npm $(npm --version 2>&1)"; echo "pi $(pi --version 2>&1)"; sha256sum /opt/pi/package-lock.json; (cd /opt/pi && npm ls --all --json 2>&1); } > /var/tmp/agent-identity.txt'
timeout_sec = 120.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
storage_mb = 10240

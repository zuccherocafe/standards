schema_version = "1.3"
artifacts = ["/var/tmp/model.patch", "/var/tmp/agent-identity.txt"]

[task]
name = "standards/dandegate-unicode-lines"
description = "dandegate counts the lines of Rust files whose comments and literals hold characters of more than one byte."
authors = []
keywords = ["rust", "review-finding"]

[metadata]
source_repository = "https://github.com/zuccherocafe/standards"
# The starting tree is the reviewed revision's tools/, built from this public base and environment/start.patch.
source_base = "3bb9db9c98b6d84557b03257b00ef8a67a2235fd"
source_revision = "a59fcf0b09f054985334a5707695f0d7b22f60b6"
source_tree = "568aadab174472393e802645a702161d292c2aa7"
# The landed revision whose correction solution/solution.patch extracts.
solution_revision = "76cf6038c0d5af90739bebe19058f528f6195b70"
# The commit the image makes of the starting tree; the agent's change is the difference from it.
starting_commit = "e9d414d03cfafb9cf212da0c31ba7686639358b4"

[environment]
# The model provider only, from start to teardown, so no phase that follows the agent's run, such as collecting its
# change, reopens the network. The image holds Node and pi, so the agent's setup needs no network.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
storage_mb = 10240

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

# The agent's change, captured in its own container before it stops, is all the verifier receives.
[[verifier.collect]]
command = "cd /app && git add -A && git diff --cached --binary e9d414d03cfafb9cf212da0c31ba7686639358b4 > /var/tmp/model.patch"
timeout_sec = 120.0

# What the agent ran on: the Node, npm and pi the image holds, and pi's installed tree.
[[verifier.collect]]
command = '{ echo "node $(node --version 2>&1)"; echo "npm $(npm --version 2>&1)"; echo "pi $(pi --version 2>&1)"; sha256sum /opt/pi/package-lock.json; (cd /opt/pi && npm ls --all --json 2>&1); } > /var/tmp/agent-identity.txt'
timeout_sec = 120.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
storage_mb = 10240

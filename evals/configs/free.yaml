# The free checks: the nop agent and the reference solution on every task, one trial at a time. Neither calls a model.
# Layer configs/treatment.yaml or configs/agent-skills.yaml after this file for the other conditions.
jobs_dir: ../.cache/evals/jobs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: podman
# Each task is its own source, so Harbor reports the mean of every reward.json field for each task and agent.
metrics:
  - type: mean
tasks:
  # Bug-fix tasks from review findings.
  - path: tasks/dandegate-literal-paths
    source: dandegate-literal-paths
  - path: tasks/design-read-fenced-code
    source: design-read-fenced-code
  - path: tasks/dandegate-unicode-lines
    source: dandegate-unicode-lines
  # Feature tasks.
  - path: tasks/dandegate-step-durations
    source: dandegate-step-durations
  - path: tasks/dandegate-steps-at-once
    source: dandegate-steps-at-once
  - path: tasks/rust-mutants-round-robin
    source: rust-mutants-round-robin
  - path: tasks/design-read-area-files
    source: design-read-area-files
  - path: tasks/dandegate-build-cache
    source: dandegate-build-cache
  - path: tasks/dandegate-host-programs
    source: dandegate-host-programs
  # Review tasks.
  - path: tasks/review-design-read-closing-fence
    source: review-design-read-closing-fence
  - path: tasks/review-dandegate-steps-file
    source: review-dandegate-steps-file
  - path: tasks/review-design-read-area-files
    source: review-design-read-area-files
  - path: tasks/review-design-read-new
    source: review-design-read-new
  - path: tasks/review-dandegate-unicode-escapes
    source: review-dandegate-unicode-escapes
  - path: tasks/review-dandegate-report-names
    source: review-dandegate-report-names
agents:
  - name: nop
  - name: oracle

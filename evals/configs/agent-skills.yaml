# The third condition: Addy Osmani's agent-skills, a widely used general bundle, added to the control's run by layering
# this file after it, as configs/treatment.yaml adds the standards. It shows whether this general bundle moves the
# results too, not whether guidance in general does. Each mount is read-only, and its relative source resolves from the
# task's environment folder, three levels below evals/. Prepare the bundle at the revision its folder names as evals/README.md says.
environment:
  mounts:
    # Harbor replaces the mount list of the configuration this one is layered on, so this repeats the experiments'
    # settings mount; the one below is the whole difference from the control.
    - type: bind
      source: ../../../configs/pi-settings.json
      target: /root/.pi/agent/settings.json
      read_only: true
    # The bundle's skills/ and references/ at ~/.agents, so pi finds the skills in ~/.agents/skills and their links
    # to ../../references resolve. The bundle's own AGENTS.md configures work on that repository, so it is left out,
    # and nothing points pi at the bundle beyond its skill list.
    - type: bind
      source: ../../../../.cache/evals/agent-skills-aeac41d4d005999432bb7312f7ff06383a91d59d
      target: /root/.agents
      read_only: true

# The treatment: the standards guidance bundle, added to the control's run by layering this file after it. Each mount
# is read-only, and its relative source resolves from the task's environment folder, three levels below evals/.
# Prepare the bundle at the revision its folder names as evals/README.md says. The treatment is a job of its own rather
# than an agent entry beside the control's: Harbor mounts for the whole job, and an agent's own skills field carries
# only skill folders, so neither the rules the skills link to nor pi's user context file could reach one agent alone.
environment:
  mounts:
    # Harbor replaces the mount list of the configuration this one is layered on, so the treatment repeats the
    # experiments' settings mount; the two below are the whole difference between the conditions.
    - type: bind
      source: ../../../configs/pi-settings.json
      target: /root/.pi/agent/settings.json
      read_only: true
    # The standards' rules, skills and templates, at ~/.agents so pi finds the skills in ~/.agents/skills and each
    # skill's relative links resolve.
    - type: bind
      source: ../../../../.cache/evals/standards-36f54298b5359b76938e115974e8085559d1a5c9
      target: /root/.agents
      read_only: true
    # pi's user-level context file, which points the agent at the bundle.
    - type: bind
      source: ../../../treatment/AGENTS.md
      target: /root/.pi/agent/AGENTS.md
      read_only: true

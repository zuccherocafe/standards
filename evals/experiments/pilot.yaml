# The pilot: pi through OpenRouter with each model below, five attempts at every task, three trials at a time, with no
# automatic trial retry. Each condition is one job of this file: the control runs it alone and the treatment layers
# configs/treatment.yaml after it, so both conditions run every model from it. Harbor's -m does not replace a model
# named here, so a round with other models is another file.
jobs_dir: ../.cache/evals/jobs
n_attempts: 5
n_concurrent_trials: 3
retry:
  max_retries: 0
environment:
  type: podman
  mounts:
    # pi's user settings, read-only, the same in both conditions. Compaction and cache warming are off, since pi
    # records neither request with a response id, so a trial that fills the model's context ends there. pi's own
    # retry of a failed request stays on, at most 3 times, and its provider-level retry off.
    - type: bind
      source: ../../../configs/pi-settings.json
      target: /root/.pi/agent/settings.json
      read_only: true
# Each task is its own source, so Harbor reports the mean of every reward.json field for each task and model.
metrics:
  - type: mean
tasks:
  - path: tasks/dandegate-literal-paths
    source: dandegate-literal-paths
  - path: tasks/design-read-fenced-code
    source: design-read-fenced-code
  - path: tasks/dandegate-unicode-lines
    source: dandegate-unicode-lines
# Every model runs with the same pi, settings and limits, which the first entry names once for all.
agents:
  - name: pi
    model_name: openrouter/deepseek/deepseek-v4.1-flash-1017
    override_setup_timeout_sec: 900
    kwargs: &pi-kwargs
      version: "1.4.0"
      thinking: high
      max_turns: 80
    env: &pi-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Keep pi to its bundled model catalogue and prices, and off every host but the model provider's.
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
  - name: pi
    model_name: openrouter/anthropic/claude-opus-5.5
    override_setup_timeout_sec: 900
    kwargs: *pi-kwargs
    env: *pi-env

# The calibration round: pi through OpenRouter with each model below on the feature and review tasks, in every condition,
# to learn whether DeepSeek's results predict Opus's. Each condition is one job of this file: the control runs it
# alone, and the treatment and the agent-skills condition layer configs/treatment.yaml or configs/agent-skills.yaml
# after it. Harbor's -m does not replace a model named here, so a round with other models is another file.
#
# n_attempts is a placeholder: the round's cost estimate sets it, in a commit of its own, before the maintainer
# approves the run.
jobs_dir: ../.cache/evals/jobs
n_attempts: 1
n_concurrent_trials: 3
retry:
  max_retries: 0
environment:
  type: podman
  mounts:
    # pi's user settings, read-only, the same in every condition. Compaction and cache warming are off, since pi
    # records neither request with a response id, so a trial that fills the model's context ends there. pi's own
    # retry of a failed request stays on, at most 3 times, and its provider-level retry off.
    - type: bind
      source: ../../../configs/pi-settings.json
      target: /root/.pi/agent/settings.json
      read_only: true
# Each task is its own source, so Harbor reports the mean of every reward.json field for each task and model.
metrics:
  - type: mean
tasks:
  # Feature tasks: a past change's brief at its base, scored by hidden behaviour tests.
  - path: tasks/dandegate-step-durations
    source: dandegate-step-durations
  - path: tasks/dandegate-steps-at-once
    source: dandegate-steps-at-once
  - path: tasks/rust-mutants-round-robin
    source: rust-mutants-round-robin
  - path: tasks/design-read-area-files
    source: design-read-area-files
  - path: tasks/dandegate-build-cache
    source: dandegate-build-cache
  - path: tasks/dandegate-host-programs
    source: dandegate-host-programs
  # Review tasks: a past change to review, scored by where its must-fix findings fall.
  - path: tasks/review-design-read-closing-fence
    source: review-design-read-closing-fence
  - path: tasks/review-dandegate-steps-file
    source: review-dandegate-steps-file
  - path: tasks/review-design-read-area-files
    source: review-design-read-area-files
  - path: tasks/review-design-read-new
    source: review-design-read-new
  - path: tasks/review-dandegate-unicode-escapes
    source: review-dandegate-unicode-escapes
  - path: tasks/review-dandegate-report-names
    source: review-dandegate-report-names
# Every model runs with the same pi, settings and limits, which the first entry names once for all.
agents:
  - name: pi
    model_name: openrouter/deepseek/deepseek-v4.1-flash-1017
    override_setup_timeout_sec: 900
    kwargs: &pi-kwargs
      version: "1.4.0"
      thinking: high
      max_turns: 80
    env: &pi-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Keep pi to its bundled model catalogue and prices, and off every host but the model provider's.
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
  - name: pi
    model_name: openrouter/anthropic/claude-opus-5.5
    override_setup_timeout_sec: 900
    kwargs: *pi-kwargs
    env: *pi-env

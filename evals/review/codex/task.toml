schema_version = "1.4"

artifacts = [{ source = "/app/analysis.json", destination = "analysis.json" }]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com"]

[verifier]
timeout_sec = 120.0

[environment]
# Built from codex/Dockerfile as evals/README.md says; it holds Codex, so setup needs no network.
docker_image = "localhost/evals-review-codex:0.163.0"
workdir = "/app"
# The container holds a login token and reads the agent's output, so it reaches Codex's model endpoint and nothing
# else, from start to teardown. auth.openai.com is left out, so the container cannot refresh, and so rotate, the
# login it was given.
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com"]
cpus = 2
memory_mb = 4096

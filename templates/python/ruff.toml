# The Python standard's formatter and linter settings (languages/python/): explicit families and rules, never the
# defaults, which a Ruff release can change. The version is pinned in the development shell.
line-length = 120
# project-specific: the latest stable Python, which the development shell pins, such as "py315"; a host script's
# folder takes its host's version under [per-file-target-version]
target-version = "py315"

[format]
quote-style = "double"

[lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "W", "F", "I", "N", "UP", "B", "BLE001", "PTH", "SIM", "C4", "RET", "PERF", "FURB", "RUF",
    "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    "S602", "PLW1510", "PLW1514",
]

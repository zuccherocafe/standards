# The Python standard's type checker settings (languages/python.md); the version is pinned in the development shell.
preset = "strict"
# project-specific: the latest stable Python, which the development shell pins; a host script's folder has its own
# pyrefly.toml with its host's version, since a sub-config cannot set one; run pyrefly check with the files as arguments
# so each file's nearest configuration applies
python-version = "3.15"
# project-specific: the folders holding Python
project-includes = ["**/*.py"]
# project-specific: each folder a script adds to its import path, and any host's type stubs, such as Blender's
search-path = []
